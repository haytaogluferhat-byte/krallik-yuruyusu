<style>

#nav button img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 2px 2px #000a)}
.badge{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;border:1px solid #fff5}

/* pencere */
#sheetBg{position:absolute;inset:0;background:#000a;z-index:40;display:none}
#sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 14px));max-height:calc(100% - 28px - env(safe-area-inset-top,0px));z-index:41;background:linear-gradient(#1b2430,#0f141b);border:2px solid #c9a24a;border-radius:14px;box-shadow:0 0 0 2px #3b2c10,0 0 0 4px #7a5f26,0 18px 50px #000d;display:none;flex-direction:column}
#sheet.open,#sheetBg.open{display:flex}
.sh{position:relative;padding:9px 48px;text-align:center;background:linear-gradient(var(--k1),var(--k2));border-bottom:2px solid #c9a24a;border-radius:11px 11px 0 0;box-shadow:inset 0 1px 0 #fff3}

.bk{position:absolute;left:7px;top:5px;width:32px;height:32px;border-radius:50%;background:radial-gradient(#3a4c62,#1b2430);border:2px solid var(--gold);font-size:15px;color:#fff;padding:0}
.sb{overflow-y:auto;padding:12px 12px 16px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 4px;border-radius:10px 10px 0 0;border:1px solid #c9a24a66;border-bottom:2px solid #c9a24a;background:#181411;font:700 12px Inter;color:var(--mut)}
.tabs button.on{background:linear-gradient(var(--k1),var(--k2));color:#fff3cf;border-color:#c9a24a}
.row{display:flex;align-items:center;gap:10px}
.btn{border:1px solid #7a5516;border-radius:11px;padding:10px 14px;font-weight:700;font-size:14px;background:linear-gradient(#f6d98a,#d19a2e);color:#2a1c06;box-shadow:inset 0 1px 0 #fff7,0 2px 0 #5a3d0c}
.btn.sec{background:linear-gradient(#3a4c62,#232f3f);color:var(--txt);border-color:#111;box-shadow:inset 0 1px 0 #fff2,0 2px 0 #0b0f14}
.btn.gl{background:linear-gradient(#4a3a18,#2c220d);border:1px solid var(--gold);color:var(--gold2);box-shadow:0 2px 0 #120d04}
.btn.rd{background:linear-gradient(#d9534f,#8e2623);color:#fff;border-color:#4a1210;box-shadow:inset 0 1px 0 #fff4,0 2px 0 #4a1210}
.btn:disabled{opacity:.45}
.card{background:#16120f;border:1px solid #2c3a4d;border-radius:12px;padding:10px}
.card.g{border-color:#c9a24a88;background:linear-gradient(#231d19,#16120f)}
.grid{display:grid;gap:8px}
.mut{color:var(--mut);font-size:12px}
h3{font:700 14px Cinzel,serif;margin:14px 0 6px;color:var(--gold2);display:flex;align-items:center;gap:8px}
h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#c9a24a88,transparent)}
.cost{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:600}
.cost span{display:flex;align-items:center;gap:3px}
.cost img{width:20px;height:20px}
.cost .no{color:#ff8f8f}
.pick{background:#16120f;border:1px solid #2c3a4d;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-align:center;position:relative}
.pick.on{border:2px solid var(--gold);background:#22303f}
.pick img{width:100%;height:70px;object-fit:contain}
.pick.lock{opacity:.4}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=number],input[type=text],input:not([type]){background:#171310;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px;font:600 14px Inter;width:100%}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{padding:5px 4px;border-bottom:1px solid #362e27;text-align:left}
th{color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
.win{color:#7fe0a3}.lose{color:#ff8f8f}
/* başlangıç */
#start{position:absolute;inset:0;z-index:80;background:radial-gradient(#2e2620,#0b0f14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#start h1{font:700 30px Cinzel,serif;color:var(--gold2);margin:0}
.kl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(560px,100%)}
.kl button{background:#141b24;border:2px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.kl button.on{border-color:var(--gold);background:#2a3a4c}
.kl img{width:100%;height:110px;object-fit:contain}
.kl small{font-weight:500;color:var(--mut);font-size:11px}
/* şampiyon */
.champ{display:grid;grid-template-columns:70px 1fr 70px;gap:6px;align-items:center;background:radial-gradient(ellipse at 50% 40%,var(--k1),#16120f 70%);border:1px solid #c9a24a88;border-radius:12px;padding:10px 8px}
.champ .col{display:flex;flex-direction:column;gap:8px;align-items:center}
.champ .mid{text-align:center}.champ .mid img{width:100%;max-height:230px;object-fit:contain;filter:drop-shadow(0 10px 12px #000b)}
.slotE{width:64px;height:64px;border-radius:12px;border:2px solid #4a5a70;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1a222d,#120f0d);position:relative;padding:0}
.slotE img{width:54px;height:54px;object-fit:contain}
.slotE small{position:absolute;bottom:1px;left:0;right:0;font-size:8.5px;color:#c9d4e0;text-shadow:0 1px 2px #000}
.rar0{border-color:#8a94a3!important}.rar1{border-color:#5b8fb9!important}.rar2{border-color:#a761f0!important}.rar3{border-color:#d4aa3c!important;box-shadow:0 0 10px #d4aa3c66}.rar4{border-color:#e5484d!important;box-shadow:0 0 12px #e5484d88}
.c0{color:#c9bba4}.c1{color:#dbc19a}.c2{color:#c79bff}.c3{color:#f0c36b}.c4{color:#ff7b7f}
.setc{background:#16120f;border:1px solid #2c3a4d;border-radius:12px;padding:8px;margin-bottom:8px}.setc.full{border-color:var(--gold)}
.setp{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:6px 0}
.setp button{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid #2c3a4d;background:linear-gradient(#1a222d,#120f0d);padding:2px}
.setp img{width:100%;height:100%;object-fit:contain}.setp .no img{filter:grayscale(1) brightness(.55)}
.setp u{position:absolute;right:2px;bottom:1px;font:700 9px Inter;text-decoration:none;background:#120f0c;border-radius:5px;padding:0 3px}
.rt{width:100%;border-collapse:collapse;font-size:12.5px}.rt td,.rt th{padding:5px 4px;border-bottom:1px solid #2b241e;text-align:right}.rt td:first-child,.rt th:first-child{text-align:left}
.skg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.skn{background:#16120f;border:1px solid #2c3a4d;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;text-align:center;position:relative}
.skn img{width:44px;height:44px;object-fit:contain;border-radius:50%;background:radial-gradient(#2a3a4c,#181411);border:2px solid #4a5a70;object-position:60% 15%}
.skn.has img{border-color:var(--gold)}.skn.max img{border-color:#7fe0a3}.skn.lock{opacity:.4}
.skn i{font-style:normal;color:var(--gold);font-size:11px}
.bar{height:8px;background:#2a3a4c;border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* === görsel arayüz === */
#sheet{background:linear-gradient(#1b150fe6,#120e0af2),url(img/tx_deri.webp) 0 0/260px;border:3px solid #c9a24a}
#sheet .crn{position:absolute;width:44px;height:40px;pointer-events:none;z-index:3;background:url(img/p_kose.webp) center/contain no-repeat}
#sheet .crn.a{left:-6px;top:-6px}#sheet .crn.b{right:-6px;top:-6px;transform:scaleX(-1)}#sheet .crn.c{left:-6px;bottom:-6px;transform:scaleY(-1)}#sheet .crn.d{right:-6px;bottom:-6px;transform:scale(-1)}
.sh{background:radial-gradient(ellipse at 50% 120%,#66483055,transparent 70%),linear-gradient(#261c13,#1a130e);padding:12px 48px 10px;border-bottom:2px solid #c9a24a}
.sh h2{display:inline-block;max-width:100%;padding:8px 34px 10px;background:url(img/p_kurdele.webp) center/100% 100% no-repeat;font-size:16px;letter-spacing:.5px}
.card,.mrow,.tiles>div,.setc,.pick,.skn{background:linear-gradient(#231b14d9,#18120de6),url(img/tx_deri.webp) 0 0/200px!important;border:1px solid #c9a24a44!important;box-shadow:inset 0 1px 0 #ffffff12,0 2px 6px #0006}
.card.g,.mrow.un{border-color:#e0b85a!important;box-shadow:inset 0 0 0 1px #e0b85a33,0 0 12px #e0b85a22}
.btn{border:0!important;background:transparent!important;border-style:solid!important;border-image:url(img/b_altin.webp) 62 70 fill / 16px 20px stretch!important;box-shadow:none!important;color:#2a1600!important;text-shadow:0 1px 0 #fff6;padding:11px 18px}
.btn.sec{border-image-source:url(img/b_mavi.webp)!important;color:#fff!important;text-shadow:0 1px 2px #0009}
.btn.rd{border-image-source:url(img/b_kirmizi.webp)!important;color:#fff!important;text-shadow:0 1px 2px #0009}
.btn.gl{border-image-source:url(img/b_altin.webp)!important}
.btn:disabled{filter:grayscale(.85) brightness(.75);opacity:.75}
.tabs button{background:linear-gradient(#1d1611,#16110d);border-color:#c9a24a55}
.tabs button.on{background:transparent;border:0;border-style:solid;border-image:url(img/b_mavi.webp) 62 70 fill / 12px 16px stretch;color:#fff}
.xp,.bar{background:transparent!important;border-style:solid;border-image:url(img/bar_bos.webp) 30 40 fill / 4px 8px stretch;border-radius:0;height:10px}
.xp i,.bar i{background:url(img/bar_dolu.webp) center/100% 100%!important;border-radius:6px}
h3{font-size:15px}
/* düğüm ağacı */
.tree{position:relative;padding-left:4px}
.tn{position:relative;display:grid;grid-template-columns:66px 1fr;gap:10px;align-items:center;padding:6px 8px;margin-bottom:12px;border-radius:14px;background:linear-gradient(90deg,#2d221acc,#18120daa);border:1px solid #c9a24a44}
.tn:not(:last-child):after{content:"";position:absolute;left:40px;top:100%;width:4px;height:14px;background:linear-gradient(#e0b85a,#7a5a1e);border-radius:2px}
.tn .md{position:relative;width:64px;height:64px}

.tn.mx{border-color:#7fe0a3aa}.tn.mx .lv{border-color:#7fe0a3;color:#7fe0a3}

/* vitrin */
.vit{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.vt{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 8px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#714e3155,transparent 70%),linear-gradient(#2c2219,#18120d);border:1px solid #c9a24a66;text-align:center}

.vt .btn img{width:16px;height:16px;vertical-align:-3px;filter:none;margin-right:2px}
/* boş ekran */
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;text-align:center;color:var(--mut)}
.empty img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 6px 8px #000b)}
.empty b{color:#fff3cf;font-size:15px}
/* ikonlu satır */
.irow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid #c9a24a22}
.irow img{width:40px;height:40px;object-fit:contain}
.irow b{color:#fff3cf}
.medal{width:34px;height:40px;object-fit:contain}
.qc{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}

.rew{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

/* tam sayfa */
#sheet.full{left:0;top:0;transform:none;width:100%;height:100%;max-height:100%;border-radius:0;border-width:0 0 0 0;box-shadow:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.ptabs button.on{background:linear-gradient(#8f5e35,#513926);border-color:#e0b85a;color:#fff}
.igrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px;align-content:start;padding:4px 2px 10px}
.islot{position:relative;aspect-ratio:1;border-radius:12px;padding:6px;border:2px solid #4a5a70;background:radial-gradient(circle at 50% 35%,#554030,#1b150f 75%);display:flex;align-items:center;justify-content:center}

.pdet{flex:none;margin:0 -12px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#2e2319f2,#18120df8),url(img/tx_deri.webp) 0 0/220px;border-top:2px solid #c9a24a;display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center}

.pdet .btns .btn{flex:1}

function battle(att,def,opt){

  const A0=eh(A),D0=eh(D);const rounds=[],SKL=[];const fx={A:{buff:{},sh:[],wk:[],vu:[],rf:[],dot:[],rg:[],ball:0,amp:[],tn:[]},D:{buff:{},sh:[],wk:[],vu:[],rf:[],dot:[],rg:[],ball:0,amp:[],tn:[]}};const ampM=(k,r)=>1+act(fx[k].amp,r).reduce((a,x)=>a+x[2],0)/100;const hit=(foe,base)=>{const tot=foe.filter(e=>!e.trap).reduce((a,e)=>a+e.n*e.h,0);if(tot>0)foe.forEach(e=>{if(e.trap||e.n<=0)return;e.n=Math.max(0,e.n-base*(e.n*e.h/tot)/e.h)})};const act=(L,r)=>L.filter(([a,b])=>r>=a&&r<=b);
  const useSk=(side,list,r)=>{(list||[]).forEach(s=>{if(s.r!=r)return;if(s.ch&&Math.random()*100>=s.ch)return;const own=side=='A'?A:D,foe=side=='A'?D:A,F=fx[side],O=fx[side=='A'?'D':'A'];const mine=own.filter(g=>!g.trap&&g.n>0&&g.t==s.cls);const src=mine.length?mine:own.filter(g=>!g.trap&&g.n>0);const half=mine.length?1:0.5;

function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const REG=new Map();
function reg(x,y){const k=x*1200+y;let v=REG.get(k);if(v===undefined){let b=1e9;for(let i=0;i<SEHIR.length;i++){const c=SEHIR[i],d=(c.x-x)*(c.x-x)+(c.y-y)*(c.y-y);if(d<b){b=d;v=i}}if(REG.size>60000)REG.clear();REG.set(k,v)}return v}
function nearFixed(x,y,r){for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){if(CITY[(x+dx)+','+(y+dy)])return true;if(S&&S.home.x==x+dx&&S.home.y==y+dy)return true}return false}
const TER=new Map();
function terr(x,y){ // p: ova, w: su, m: dağ, f: orman
  const k=x*1200+y;let v=TER.get(k);if(v)return v;
  if(Math.max(Math.abs(x-600),Math.abs(y-600))<4||nearFixed(x,y,1))v='p';
  else if(vn(x/9,y/9,11)<0.16)v='w';
  else if(vn(x/6,y/6,23)>0.9)v='m';
  else if(vn(x/5,y/5,37)>0.83&&hash(x,y,41)<0.4)v='f';
  else v='p';
  if(TER.size>60000)TER.clear();TER.set(k,v);return v}

    return{k:'camp',key,x,y,n:'Canavar yuvası',lv,img:'img/harita_kamp2_'+(lv<=3?1:lv<=7?2:3)+'.webp',w:[0,.8,.82,.85,.95,1,1.03,1.06,1.15,1.2,1.25][lv]}}

    const used=(S&&S.taken[key])||0;const cap=Math.round(8000*Math.pow(lv,1.6)*(t=='gumus'?0.2:1));if(used>=cap)return null;

  return null;
}

function tick(){try{incAlarm();document.body.classList.toggle('danger',incoming().length>0)}catch(e){}
  const t=now(),dt=Math.min((t-S.t)/60000,60*24);S.t=t;
  {const el=eqList(),pm={};S.fields.forEach((f,i)=>{if(f&&f.lv>0){const r=BD[f.b].pr;if(pm[r]==null)pm[r]=1+eqX(RESN[r].toLocaleLowerCase('tr')+' üretimi')/100+allyR(r=='yemek'?'ymk':r=='odun'?'odn':'mdn')/100+(rx('p_'+r)+rx('prod')+allyR('prd'))/100;S.res[r]+=prod(f.lv)*pm[r]*dt*FMUL}})}
  S.slots.forEach(s=>{if(s&&s.b=='konak'&&s.lv>0)S.res.gumus+=prod(s.lv)*0.4*dt*(1+(rx('p_gumus')+rx('prod')+allyR('gms')+allyR('prd'))/100)});
  for(const j of [...S.jobs]){if(j.end<=t)finishJob(j)}
  hgAbsorb();for(const m of [...S.marches])stepMarch(m,t);
  if(S.kale.lv>=4&&t>S.nextRaid){if(shielded())S.nextRaid=S.shield+(5+Math.random()*10)*60e3;else raid()}
  if(S.rev&&S.rev.length){const due=S.rev.filter(r=>r.at<=t);S.rev=S.rev.filter(r=>r.at>t);due.forEach(r=>{if(shielded())mail('sis',r.n+' kalkanına çarptı','['+r.tag+'] '+r.n+' misilleme için geldi ama barış kalkanın şehrini korudu.');else raid(r)})}

}

function train(){const t=trSel.t,k=trSel.k,n=trSel.n;const c=[...UC[t].map(v=>v*MULT[k-1]*n),AG[k-1]*n];

function openPick(c,sl){const L=S.items.filter(i=>i.sl==sl&&canWear(c,i)).sort((a,b)=>b.r-a.r||(b.el||0)-(a.el||0));
  popup(sl+' seç · '+cmD(c)[1],L.length?`<div class="igrid" style="max-height:60vh">${L.map(it=>{const w=wearOf(it.id);return `<button class="islot q${it.r}" onclick="equipTo('${c}',${it.id});openChamp('Teçhizat')"><img src="img/${slug(it.n)}.webp" alt=""><u>+${it.el||0}</u>${w?`<em class="wr"><img src="${cmFace(w[0])}" alt=""></em>`:''}</button>`}).join('')}</div><p class="mut">Yalnızca ${UN[cmD(c)[3]]} eşyaları ve her birliğe uyan eşyalar listelenir. Başka kahramanın giydiği eşyayı seçersen ondan alınır.</p>`:empty('es_sandik_bos','Bu yuva için eşya yok','Canavar yuvaları ve bölge şehirleri eşya düşürür.'),"openChamp('Teçhizat')")}
function equip(id){const it=S.items.find(i=>i.id==id);if(!it)return;const own=CM.filter(c=>cmS(c[0]).st&&canWear(c[0],it));if(!own.length)return toast('Bu eşyayı giyebilecek '+UN[itCls(it)]+' kahramanın yok');
  popup('Kime giydirilsin?',`<div class="cmrow" style="flex-wrap:wrap">${own.map(c=>{const cur=itemOf(c[0],it.sl);return `<button style="--rc:${CRC[c[2]]}" onclick="equipTo('${c[0]}',${id});eqCm='${c[0]}';openChamp('Teçhizat')"><img src="${cmFace(c[0])}" alt=""><b>${c[1].split(' ').pop()}</b><span>${cur?'Değiştir':'Boş'}</span></button>`}).join('')}</div>`,'openBag()')}
function equipOld(id){const it=S.items.find(i=>i.id==id);if(!it)return;const two=it.sl=='Silah'||it.sl=='Yüzük';}
function salvage(id){const i=S.items.findIndex(q=>q.id==id);if(i<0)return;S.res.gumus+=SALV[S.items[i].r];S.mats+=SALM[S.items[i].r];S.items.splice(i,1);openBag();renderHud()}

// ---------- görevler ----------
const Q=[
 ['Çiftliği Sv 2 yap',()=>S.fields.some(f=>f&&f.b=='ciftlik'&&f.lv>=2),{yemek:2000,odun:2000},100],
 ['Bir Kışla dik',()=>count('kisla')>=1,{yemek:3000,odun:3000},200],
 ['Kale Sv 2',()=>S.kale.lv>=2,{tas:3000,demir:1500},200],
 ['Kışla\'da asker eğit',()=>Object.values(S.troops).reduce((a,b)=>a+b,0)+S.marches.reduce((a,m)=>a+Object.values(m.sel).reduce((x,y)=>x+y,0),0)>=1400,{yemek:4000,demir:1500},300],
 ['Bir canavar yuvasını kes',()=>(S.stats.camps||0)>=1||S.reports.some(r=>r.type=='atk'&&r.win),{gumus:2000},500],
 ['Bir arsadan kaynak topla',()=>Object.keys(S.taken).some(k=>!k.startsWith('city')),{odun:5000,tas:5000},300],
 ['Bir kahramanı 2 yıldız yap',()=>Object.values(S.cm).some(c=>c.st>=2),{gumus:1500},200],
 ['Bir Konak dik',()=>count('konak')>=1,{gumus:2500},300],
 ['Kale Sv 3',()=>S.kale.lv>=3,{yemek:8000,odun:8000},400],
 ['Bir Akademi dik',()=>count('akademi')>=1,{gumus:5000},400],
 ['Bir kahramana eşya giydir',()=>eqIds().length>=1,{demir:5000},300],
 ['Bir Tuzak Atölyesi dik',()=>count('tuzak_atolyesi')>=1,{tas:8000},400],
 ['Kale Sv 5',()=>S.kale.lv>=5,{yemek:20000,odun:20000,tas:12000},800],
 ['Bir Hastane dik',()=>count('hastane')>=1,{yemek:15000,demir:8000},600],
 ['Bir bölge şehri ele geçir',()=>Object.keys(S.taken).some(k=>k.startsWith('city')),{gumus:20000},1500],
 ['Kale Sv 10',()=>S.kale.lv>=10,{yemek:80000,odun:80000,tas:60000,demir:40000},3000],
 ['Bir kahraman daveti yap',()=>(S.dv||{}).d>0||(S.dv||{}).n>0,{gumus:3000},100,["openSummon()",'Bedava davet her gün yenilenir']],
 ['Keşifte 5 bölüm geç',()=>(S.ex||{}).st>=5,{yemek:10000,odun:10000},150,["openExplore()",'Savaş düğmesine bas']],
 ['Sunucu yarışında 300 puan topla',()=>S.ev.p>=300||S.ev.c.length>0,{tas:8000},150,["openEvent('gun')",'Yarışın konusu 3 kat puan verir']],
 ['Bir yoldaşı Sv 5 yap',()=>Object.values(S.yd||{}).some(l=>l>=5),{gumus:5000},200,["openYd()",'Yoldaş yemiyle besle']],
 ['Arenada bir maç kazan',()=>(S.ar||{}).best<1000,{demir:8000},200,["openArena()",'En alttaki rakip en kolayıdır']],
 ['Bir ittifaka katıl',()=>!!S.ally,{gumus:8000},300,["openAlly()",'']],
 ['Bir kahraman sancağını Sv 1 yap',()=>Object.values(S.snc||{}).some(l=>l>=1),{gumus:6000},200,["openCmd()",'Kahraman seç, Gelişim sekmesinin altına bak']],
 ['Keşifte 20 bölüm geç',()=>(S.ex||{}).st>=20,{yemek:40000,odun:40000},400,["openExplore()",'']],
 ['Kale Sv 15',()=>S.kale.lv>=15,{yemek:200000,odun:200000,tas:150000,demir:100000},1500,["nav('city')",'Kaleye dokun, Yükselt de']],
 ['Arenada ilk 500\'e gir',()=>(S.ar||{}).best<=500,{gumus:30000},500,["openArena()",'']],
 ['Bir kahramanı 5 yıldız yap',()=>Object.values(S.cm).some(c=>c.st>=5),{gumus:40000},800,["openCmd()",'']],
 ['Keşifte 50 bölüm geç',()=>(S.ex||{}).st>=50,{yemek:150000,odun:150000},800,["openExplore()",'']],
 ['Kale Sv 20',()=>S.kale.lv>=20,{yemek:600000,odun:600000,tas:400000,demir:300000},3000,["nav('city')",'Kaleye dokun, Yükselt de']],
 ['Arenada ilk 100\'e gir',()=>(S.ar||{}).best<=100,{gumus:100000},1500,["openArena()",'']],
 ['Keşifte 100 bölüm geç',()=>(S.ex||{}).st>=100,{yemek:500000,odun:500000},2000,["openExplore()",'']],
 ['Kale Sv 25',()=>S.kale.lv>=25,{yemek:2000000,odun:2000000,tas:1500000,demir:1000000},5000,["nav('city')",'Kaleye dokun, Yükselt de']],
 ['Kale Sv 30',()=>S.kale.lv>=30,{yemek:5000000,odun:5000000,tas:4000000,demir:3000000},10000,["nav('city')",'Kaleye dokun, Yükselt de']]
];
const questReady=()=>Q.some((q,i)=>!S.qd.includes(i)&&q[1]());
let qTab='gun';
function openQuests(){const list=Q.map((q,i)=>[q,i]).filter(([,i])=>!S.qd.includes(i)).slice(0,6);
  const qi=n=>/kamp/i.test(n)?'g_kamp':/Kale Sv/.test(n)?'g_kale':/asker|Kışla/.test(n)?'g_asker':/topla/.test(n)?'toplanan':/kahraman/i.test(n)?'m1':'gorev';
  const D=dly(),pt=dPts();const tabs=`<div class="tabs"><button class="${qTab=='gun'?'on':''}" onclick="qTab='gun';openQuests()">Günlük</button><button class="${qTab=='ana'?'on':''}" onclick="qTab='ana';openQuests()">Ana görev</button></div>`;
  const ana=(()=>{const C=qChap();return `<div class="card g" style="margin-bottom:8px"><b>Bölüm ${C.c+1}: ${CHP2[C.c]}</b><div class="xp" style="height:6px;margin-top:5px"><i style="width:${C.d/6*100}%"></i></div><small class="mut">${C.d}/6 görev</small></div>`})()+list.map(([q,i])=>{const ok=q[1]();return `<div class="tkr ${ok?'ok':''}"><div class="tkh"><span>✦ ${q[0]}</span>${ok?'<i>✓</i>':''}</div><div class="tkb"><div class="rchs">${Object.entries(q[2]).map(([r,v])=>`<span class="rch it q1"><img src="${IC(RESI[r])}" alt=""><b>${big(v)}</b></span>`).join('')}${iTile('gold',q[3])}${iTile('sn1',1)}</div>${ok?`<button class="tbt g" onclick="claim(${i})">Topla</button>`:`<button class="tbt" onclick="closeSheet()">Git</button>`}</div></div>`}).join('')||empty('ui_gorev','Bütün görevler bitti!','');
  const gun=`<div class="card dlb"><div class="row" style="justify-content:space-between"><b>Günlük puan</b><b style="font-size:17px">${pt} / 100</b></div><div class="dlt"><div class="xp"><i style="width:${pt}%"></i></div>${DLR.map(([need],i)=>{const got=D.got.includes(i),ok=pt>=need;return `<button class="${got?'got':ok?'ok':''}" style="left:${need}%" onclick="${ok&&!got?`dClaim(${i})`:`toast('${need} puan: ${rewTxt(DLR[i][1])}')`}"><img src="img/es_sandik_${Math.min(4,i<1?1:i<3?2:i<4?3:4)}.webp" alt=""><em>${need}</em></button>`}).join('')}</div></div>
  ${dlyL().map(([k,n,need,p,ic])=>{const c=Math.min(need,D.c[k]||0),ok=c>=need;return `<div class="tkr ${ok?'ok':''}"><div class="tkh"><span>${n}</span><em class="${ok?'':'lose'}">(${nf(c)}/${nf(need)})</em></div><div class="tkb"><div class="rchs"><span class="rch it q3"><img src="img/${ic}.webp" alt=""><b>+${p}</b></span></div>${ok?'<i class="tok">✓</i>':`<button class="tbt" onclick="closeSheet()">Git</button>`}</div></div>`}).join('')}
  <p class="mut">Günlük görevler her gün sıfırlanır. Görevleri bitirdikçe puan kazanırsın; 20, 40, 60, 80 ve 100 puanda birer sandık açılır. Sandıklara dokunarak içindekini görebilirsin.</p>`;
  sheet('Görevler',tabs+(qTab=='gun'?gun:ana))}
function claim(i){const q=Q[i];if(!q[1]())return;S.qd.push(i);S.inv.sn1=(S.inv.sn1||0)+1;for(const [r,v] of Object.entries(q[2]))S.res[r]+=v;S.gold+=q[3];rewPop({...Object.fromEntries(Object.entries(q[2]).map(([r,v])=>[{yemek:'ry',odun:'ro',tas:'rt',demir:'rd',gumus:'gum'}[r]||r,v/1e5])),gold:q[3],sn1:1});openQuests();renderHud()}

// ---------- başlangıç ----------
let stK='krallik',stC=0;
function showStart(){const s=$('#start');s.style.display='flex';
  s.innerHTML=`<h1>Krallık Yürüyüşü</h1><img src="img/harita_sehir.webp" alt="" style="height:170px"><div class="mut">Kaleni kur, ordunu topla, tahta yürü.</div>
  <input id="nm" type="text" maxlength="18" placeholder="Lord adın" value="${(window.nmv||'')}" style="max-width:320px" oninput="window.nmv=this.value">
  <button class="btn" style="min-width:200px" onclick="begin()">Başla</button><p class="mut" style="max-width:420px;margin:0">Deneme sürümü: ilerlemen bu cihazda saklanır.</p>`}
function welcomeMail(){mail('sis','Krallığa hoş geldin','Lordum, kalen kuruldu. Ustaların emrini bekliyor, kışlanda ilk askerlerin hazır. İlk 24 saat barış kalkanı seni korur; bu süreyi şehrini büyütmek için kullan. Arena gladyatörü Finn ilk kahramanın oldu. Başlangıç hediyen ekte.',{gold:500,h5:5,kay:1,pSSR:1,nis:30});mail('kr','Krallık haberi: Taht boş','Krallık Tahtı sahipsiz. Beş Koltuk Kalesi\'ni ele geçiren lord tahta yürüyebilir.')}
function begin(){const n=(window.nmv||'').trim()||'Lord '+Math.floor(Math.random()*900+100);S=fresh('krallik',n);S.tut=0;welcomeMail();$('#start').style.display='none';save();boot();setTimeout(()=>popup('Hoş geldin, '+S.name,`<div class="card g"><div class="qc" style="grid-template-columns:54px 1fr"><img src="img/ui_gorev.webp" alt=""><div><b style="font-size:15px">Sıradaki görev</b><div class="mut" style="font-size:12px">Ekranın altındaki görev şeridi sana hep bir sonraki adımı gösterir. Dokun, seni oraya götürsün.</div></div></div></div><div class="card"><div class="qc" style="grid-template-columns:54px 1fr"><img src="img/ui_g_kale.webp" alt=""><div><b style="font-size:15px">Kaleni büyüt</b><div class="mut" style="font-size:12px">Kale seviyesi yeni binaları ve özellikleri açar: Davet Sv 2, Keşif Sv 3, Etkinlikler Sv 4, Yoldaşlar Sv 5, Arena Sv 6.</div></div></div></div><div class="card"><div class="qc" style="grid-template-columns:54px 1fr"><img src="img/es_sandik_2.webp" alt=""><div><b style="font-size:15px">Sandık topla</b><div class="mut" style="font-size:12px">Görevler, kamplar ve günlük ödüller sandık verir. Çanta'dan açarsın.</div></div></div></div><button class="btn big" style="margin-top:6px" onclick="closeSheet()">Başla</button>`),500)}
async function ownGift(){try{if(!window.claude||!claude.use)return;const u=await claude.use('user');if(!u||!S||S.ownG)return;if(!(await u.isOwner()))return;S.ownG=1;S.gold+=1000000;RES.forEach(r=>S.res[r]=(S.res[r]||0)+500e6);saveT=0;save();renderHud();toast('Kurucu hediyesi: 1.000.000 elmas ve her kaynaktan 500M')}catch(e){}}
function boot(){setTimeout(ownGift,1500);document.body.className=S.klik;tick();fitCity();render();if(!window.__iv){window.__iv=setInterval(()=>{tick();renderHud();if(view=='city'&&S.jobs.some(j=>j.k=='build'&&j.end-now()<=vipFree()*1000&&!j.fs)){S.jobs.forEach(j=>{if(j.end-now()<=vipFree()*1000)j.fs=1});renderCity()}},1000);setInterval(()=>{if(view=='map'&&(S.marches.length||FX.length))reqMap()},60)}}
panZoom($('#cityView'),()=>cam,c=>{cam={...cam,...c};applyCam()},e=>{if(citySel&&!e.target.closest('.slotBtn,.ring,.free')){citySel=null;renderCity()}},[0.3,2.4]);
panZoom($('#mapView'),()=>mp,c=>{mp={...mp,...c};clampMap();reqMap();actClose()},mapTap,[0.42,1.5]);
window.addEventListener('resize',()=>{if(!S)return;applyCam();reqMap();renderHud()});
function runLoader(done){const L=['zemin_sehir6','zemin_sehir7','harita_sehir','bg_harita','ikon_dunya','ikon_sampiyon','ikon_canta','ikon_magaza','ikon_ittifak','ikon_etkinlikler','ikon_posta','es_sandik_1','es_sandik_2','es_sandik_3','es_sandik_4','elmas','mon_golem','evb_fest'].map(n=>'img/'+n+'.webp');
  const TIPS=['Kale yükleniyor…','Lav nehirleri akıyor…','Ustalar iskeleye çıkıyor…','Ordu toplanıyor…','Kara Yarık uyanıyor…','Harita çiziliyor…'];let n=0,ti=0,fin=0;const t0=Date.now(),bar=$('#lbi'),pc=$('#lpct'),tp=$('#ltip');
  const tick=setInterval(()=>{ti=(ti+1)%TIPS.length;tp.textContent=TIPS[ti]},1400);
  const step=()=>{n++;const v=Math.round(n/L.length*100);bar.style.width=v+'%';pc.textContent=v+'%';if(n>=L.length)end()};
  const end=()=>{if(fin)return;fin=1;bar.style.width='100%';pc.textContent='100%';setTimeout(()=>{clearInterval(tick);done();const ld=$('#loader');ld.classList.add('out');setTimeout(()=>ld.remove(),600)},Math.max(300,1600-(Date.now()-t0)))};
  L.forEach(s=>{const i=new Image();i.onload=i.onerror=step;i.src=s});setTimeout(end,9000)}
runLoader(()=>{if(typeof S!='undefined'&&S)return;if(load()){boot()}else showStart()});
</script>
